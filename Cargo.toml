[workspace]
resolver = "3"
members = ["crates/*"]
# What a plain `cargo build` (and `cargo build --release`) at the root builds:
# everything but the simulation. Cargo unifies features across the packages
# of one build, so building verified-sim alongside verified-cli would turn on
# the `sim` shims of verified-server and verified-tui inside the shipped
# binary. verified-cli also refuses to compile with them on (see its main.rs),
# which is what stops `cargo build --workspace`; `just release-without-sim`
# builds this set in release and checks its resolved features.
default-members = [
    "crates/verified-cli",
    "crates/verified-core",
    "crates/verified-domain",
    "crates/verified-server",
    "crates/verified-tui",
    "crates/verified-wire",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Mats-Dodd/verified"

[workspace.dependencies]
# Workspace crates.
verified-domain = { path = "crates/verified-domain", version = "0.1.0" }
verified-core = { path = "crates/verified-core", version = "0.1.0" }
verified-wire = { path = "crates/verified-wire", version = "0.1.0" }
verified-server = { path = "crates/verified-server", version = "0.1.0" }
verified-tui = { path = "crates/verified-tui", version = "0.1.0" }
verified-sim = { path = "crates/verified-sim", version = "0.1.0" }

# Every external dependency is declared once here with default features off;
# crates opt into exactly the features they use.

# Verification. vstd must match the Verus release used by `just verify`
# (0.2026.10.04.426d8b0); `cargo verus verify` refuses a mismatched pair.
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false, features = ["std"] }
stateright = { version = "=0.31.0", default-features = false }
turmoil = { version = "=0.7.2", default-features = false, features = ["unstable-fs", "unstable-barriers"] }
proptest = { version = "1", default-features = false, features = ["std"] }
insta = { version = "1", default-features = false }
# Simulation only. 0.9 matches the rand turmoil and stateright already link.
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }

# Async runtime and IO.
tokio = { version = "1", default-features = false, features = ["rt", "macros", "sync", "net", "time", "process", "io-util"] }
tokio-util = { version = "0.7", default-features = false }
# The Stream trait, to poll crossterm's EventStream without a combinator crate.
futures-core = { version = "0.3", default-features = false }
# OS entropy for the real Entropy seam; simulation seeds its own.
getrandom = { version = "0.3", default-features = false }
async-trait = { version = "0.1", default-features = false }
rustix = { version = "1", default-features = false, features = ["std", "process"] }

# HTTP: injected IO everywhere (axum serves any Listener, hyper takes a connector).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "0.1", default-features = false, features = ["client-legacy", "http1", "tokio"] }
http-body-util = { version = "0.1", default-features = false }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "native-tokio", "tls12"] }
tower-service = { version = "0.3", default-features = false }

# Data.
thiserror = { version = "2", default-features = false, features = ["std"] }
serde = { version = "1", default-features = false, features = ["std", "derive"] }
serde_json = { version = "1", default-features = false, features = ["std"] }
uuid = { version = "1", default-features = false, features = ["std", "serde"] }

# Terminal.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", default-features = false, features = ["event-stream"] }
tui-markdown = { version = "0.3", default-features = false }
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

# Diagnostics.
tracing = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["std", "fmt"] }

[profile.dev]
debug-assertions = true
overflow-checks = true

[profile.release]
debug = "line-tables-only"
overflow-checks = true
# Crash-only (Law 8): a panic anywhere kills the process, including tasks the
# World does not supervise (axum spawns one per connection). Test harnesses
# ignore this setting (cargo builds tests with unwinding), and the simulation
# sweeps in `sim-release` below, so `cargo test --release` and the sim's
# per-host crash on panic are unaffected.
panic = "abort"

# The simulation in release: optimized, but unwinding, so that a daemon panic
# crashes its turmoil host (`shim::crash` under `sim`) and the sweep reports
# the seed instead of aborting. Never used for the shipped binary.
[profile.sim-release]
inherits = "release"
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
deprecated_in_future = "warn"
let_underscore_drop = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
missing_copy_implementations = "warn"
missing_debug_implementations = "warn"
missing_docs = "allow"
non_ascii_idents = "deny"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
# `verus_keep_ghost` and `verus_only` are set by Verus while verifying;
# plain cargo builds never see them.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)", "cfg(verus_only)"] }
unit_bindings = "warn"
unnameable_types = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "warn"
unstable_features = "deny"
unused_import_braces = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
missing_crate_level_docs = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
ignore_without_reason = "warn"
unwrap_used = "deny"
expect_used = "allow"
get_unwrap = "deny"
panic = "warn"
indexing_slicing = "warn"
string_slice = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
assertions_on_result_states = "warn"
missing_assert_message = "warn"
should_panic_without_expect = "warn"
print_stdout = "deny"
print_stderr = "deny"
as_conversions = "warn"
as_underscore = "warn"
checked_conversions = "warn"
big_endian_bytes = "warn"
host_endian_bytes = "deny"
decimal_bitwise_operands = "warn"
precedence_bits = "warn"
float_cmp = "warn"
lossy_float_literal = "warn"
integer_division = "warn"
modulo_arithmetic = "warn"
unchecked_time_subtraction = "warn"
arithmetic_side_effects = "warn"
non_zero_suggestions = "warn"
map_err_ignore = "warn"
wildcard_enum_match_arm = "warn"
significant_drop_tightening = "warn"
iter_over_hash_type = "deny"
non_std_lazy_statics = "warn"
clone_on_ref_ptr = "warn"
implicit_clone = "warn"
infinite_loop = "warn"
large_futures = "warn"
large_types_passed_by_value = "warn"
mixed_read_write_in_expression = "warn"
mutex_atomic = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
unused_async = "warn"
error_impl_error = "warn"
impl_trait_in_params = "warn"
match_wild_err_arm = "warn"
needless_pass_by_ref_mut = "warn"
multiple_inherent_impl = "warn"
partial_pub_fields = "warn"
ref_option = "warn"
return_self_not_must_use = "warn"
same_name_method = "warn"
str_to_string = "warn"
unnecessary_box_returns = "warn"
wildcard_imports = "warn"
mod_module_files = "warn"
separated_literal_suffix = "warn"
min_ident_chars = "warn"
renamed_function_params = "warn"
single_char_lifetime_names = "warn"
unused_trait_names = "warn"
default_numeric_fallback = "warn"
missing_const_for_fn = "warn"
doc_link_code = "warn"
too_long_first_doc_paragraph = "warn"
missing_docs_in_private_items = "allow"
create_dir = "warn"
exit = "warn"
filetype_is_file = "warn"
format_push_string = "warn"
let_underscore_must_use = "warn"
mem_forget = "warn"
redundant_type_annotations = "warn"
try_err = "warn"
unnecessary_self_imports = "warn"
unused_result_ok = "warn"
verbose_file_reads = "warn"
doc_broken_link = "warn"
redundant_test_prefix = "warn"
too_many_lines = "allow"
