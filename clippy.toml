  { path = "std::cell::LazyCell", reason = "interior mutability must be enumerable; name writer and invariant via #[expect]" },
  { path = "std::sync::atomic::AtomicBool", reason = "interior mutability must be enumerable; name writer and invariant via #[expect]" },
  { path = "std::sync::atomic::AtomicI8", reason = "interior mutability must be enumerable; name writer and invariant via #[expect]" },
  { path = "std::sync::atomic::AtomicI16", reason = "interior mutability must be enumerable; name writer and invariant via #[expect]" },
  { path = "std::sync::atomic::AtomicI32", reason = "interior mutability must be enumerable; name writer and invariant via #[expect]" },
  { path = "std::sync::atomic::AtomicI64", reason = "interior mutability must be enumerable; name writer and invariant via #[expect]" },
