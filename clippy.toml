  { path = "std::time::SystemTime::elapsed", reason = "wall time enters through an explicit Clock seam" },
  { path = "std::time::Instant::now", reason = "monotonic time enters through an explicit Clock seam" },
  { path = "std::time::Instant::elapsed", reason = "monotonic time enters through an explicit Clock seam" },
  { path = "std::thread::sleep", reason = "sleeping enters through an explicit Clock seam" },
  { path = "tokio::time::sleep", allow-invalid = true, reason = "sleeping enters through an explicit Clock seam" },
  { path = "tokio::time::sleep_until", allow-invalid = true, reason = "sleeping enters through an explicit Clock seam" },
  { path = "tokio::time::interval", allow-invalid = true, reason = "periodic ticks enter through an explicit Clock seam" },
  { path = "tokio::time::interval_at", allow-invalid = true, reason = "periodic ticks enter through an explicit Clock seam" },
  { path = "chrono::Utc::now", allow-invalid = true, reason = "wall time enters through an explicit Clock seam" },
  { path = "chrono::Local::now", allow-invalid = true, reason = "wall time enters through an explicit Clock seam" },
  { path = "rand::random", allow-invalid = true, reason = "randomness enters through an explicit Entropy seam" },
  { path = "rand::rng", allow-invalid = true, reason = "randomness enters through an explicit Entropy seam" },
  { path = "rand::rngs::thread::rng", allow-invalid = true, reason = "randomness enters through an explicit Entropy seam" },
  { path = "rand::random_range", allow-invalid = true, reason = "randomness enters through an explicit Entropy seam" },
