  { path = "std::fs::hard_link", reason = "durable state enters through an explicit storage seam" },
  { path = "std::fs::metadata", reason = "durable state enters through an explicit storage seam" },
  { path = "std::fs::symlink_metadata", reason = "durable state enters through an explicit storage seam" },
