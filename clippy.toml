  { path = "std::path::Path::read_dir", reason = "durable state enters through an explicit storage seam" },
  { path = "tokio::fs::read", allow-invalid = true, reason = "IO goes through the shim" },
  { path = "tokio::fs::write", allow-invalid = true, reason = "IO goes through the shim" },
  { path = "tokio::fs::read_to_string", allow-invalid = true, reason = "IO goes through the shim" },
