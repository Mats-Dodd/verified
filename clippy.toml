  { path = "rand::random_iter", allow-invalid = true, reason = "randomness enters through an explicit Entropy seam" },
  { path = "std::fs::read", reason = "durable state enters through an explicit storage seam" },
  { path = "std::fs::write", reason = "durable state enters through an explicit storage seam" },
  { path = "std::fs::read_to_string", reason = "durable state enters through an explicit storage seam" },
  { path = "std::fs::read_dir", reason = "durable state enters through an explicit storage seam" },
  { path = "std::fs::File::open", reason = "durable state enters through an explicit storage seam" },
