[package]
name = "verified-server"
description = "The verified daemon: shell loop, seams, log, HTTP routes, model client, tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Swaps the IO shim (`shim.rs`) to turmoil's simulated network, filesystem,
# clock and barriers. Enabled by verified-sim; never by the shipped binary.
sim = ["dep:turmoil"]

[dependencies]
async-trait.workspace = true
axum.workspace = true
futures-core.workspace = true
getrandom.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-util.workspace = true
# `fs` for the log, the project files and the daemon directory, in addition
# to the workspace's runtime, net, process and io features.
rustix = { workspace = true, features = ["fs"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
# The model client dials through any `Service<Uri>` connector.
tower-service.workspace = true
turmoil = { workspace = true, optional = true }
verified-core.workspace = true
verified-domain.workspace = true
verified-wire.workspace = true

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
